schema_version: 1

context:
  name: mypy-boto3-redshift-data
  version: "1.43.102"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 4db4946f7603fd41180a7b4e9641c7235ce8bdd7d286a4c94858a305d9454864

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=60
  run:
    - python >=${{ python_min }}
    - typing_extensions
    - boto3
tests:
  - python:
      imports:
        - mypy_boto3_redshift_data
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Type annotations for boto3.RedshiftDataAPIService 1.34.0 service generated with mypy-boto3-builder 7.21.0
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/youtype/mypy_boto3_builder
  repository: https://github.com/youtype/mypy_boto3_builder

extra:
  recipe-maintainers:
    - xylar
